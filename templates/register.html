{% extends "base.html" %}
{% block title %}สมัครสมาชิก{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl border border-slate-100 my-10">
    <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">สมัครสมาชิก</h2>
    <form action="/register" method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อ-นามสกุล</label>
            <input type="text" name="fullname" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อผู้ใช้งาน (Username)</label>
            <input type="text" name="username" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน</label>
            <input type="password" name="password" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-semibold hover:bg-emerald-700 transition">ลงทะเบียน</button>
    </form>
    <p class="mt-4 text-center text-sm text-slate-600">มีบัญชีอยู่แล้ว? <a href="/login" class="text-indigo-600 font-semibold hover:underline">เข้าสู่ระบบ</a></p>
</div>
{% endblock %}
